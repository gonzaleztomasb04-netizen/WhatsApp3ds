name: build-3dsx
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        working-directory: client
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: whatsapp3ds
          path: |
            client/*.3dsx
            client/*.elf

  cia:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: whatsapp3ds
          path: out
      - name: Herramientas
        run: |
          curl -L https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip -o bannertool.zip
          unzip -o bannertool.zip -d bt
          curl -L https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.3/makerom-v0.18.3-ubuntu_x86_64.zip -o makerom.zip
          unzip -o makerom.zip -d mr
          chmod +x bt/linux-x86_64/bannertool mr/makerom
      - name: Recursos
        run: |
          sudo apt-get install -y python3-pil || pip install --break-system-packages pillow
          python3 - <<'PY'
          import wave
          from PIL import Image, ImageDraw, ImageFont

          BOLD = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"

          def font(size):
              try:
                  return ImageFont.truetype(BOLD, size)
              except Exception:
                  return ImageFont.load_default()

          def gradient(w, h, c1, c2):
              img = Image.new("RGB", (w, h))
              d = ImageDraw.Draw(img)
              for y in range(h):
                  t = y / (h - 1)
                  c = tuple(int(c1[i] + (c2[i] - c1[i]) * t) for i in range(3))
                  d.line([(0, y), (w, y)], fill=c)
              return img

          def bubble(d, cx, cy, r, fill):
              d.ellipse([cx - r, cy - r, cx + r, cy + r], fill=fill)
              d.polygon([(cx - 0.9 * r, cy + 0.2 * r),
                         (cx - 1.15 * r, cy + 1.1 * r),
                         (cx - 0.2 * r, cy + 0.85 * r)], fill=fill)

          # Banner 256x128 (se dibuja 4 veces mas grande y se reduce)
          S = 4
          img = gradient(256 * S, 128 * S, (7, 94, 84), (37, 211, 102))
          d = ImageDraw.Draw(img)
          bubble(d, 250, 235, 140, (255, 255, 255))
          d.text((250, 235), "3DS", font=font(100), fill=(7, 94, 84), anchor="mm")
          d.text((440, 215), "WhatsApp", font=font(88), fill=(255, 255, 255), anchor="lm")
          d.text((440, 310), "para Nintendo 3DS", font=font(46), fill=(220, 248, 198), anchor="lm")
          img.resize((256, 128), Image.LANCZOS).save("banner.png")

          # Icono 48x48
          S = 8
          n = 48 * S
          img = gradient(n, n, (7, 94, 84), (37, 211, 102))
          d = ImageDraw.Draw(img)
          bubble(d, 192, 176, 110, (255, 255, 255))
          for x in (140, 192, 244):
              d.ellipse([x - 20, 156, x + 20, 196], fill=(7, 94, 84))
          img.resize((48, 48), Image.LANCZOS).save("icon.png")

          # Audio silencioso de 1 segundo
          a = wave.open("audio.wav", "wb")
          a.setnchannels(1)
          a.setsampwidth(2)
          a.setframerate(22050)
          a.writeframes(b"\x00\x00" * 22050)
          a.close()
          PY
      - name: Configuracion
