name: build-3dsx
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        working-directory: client
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: whatsapp3ds
          path: client/*.3dsx
