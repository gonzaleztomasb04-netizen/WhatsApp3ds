      - name: Crear CIA
        run: |
          bt/linux-x86_64/bannertool makebanner -i banner.png -a audio.wav -o banner.bnr
          bt/linux-x86_64/bannertool makesmdh -s "WhatsApp 3DS" -l "Cliente de WhatsApp para 3DS" -p "Autor" -i icon.png -o icon.icn
          mr/makerom -f cia -o whatsapp3ds.cia -target t -exefslogo -elf out/whatsapp3ds.elf -rsf app.rsf -icon icon.icn -banner banner.bnr
      - uses: actions/upload-artifact@v4
        with:
          name: whatsapp3ds-cia
          path: whatsapp3ds.cia
