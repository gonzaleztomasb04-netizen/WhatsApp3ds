name: build-3dsx
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        working-directory: client
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: whatsapp3ds
          path: |
            client/*.3dsx
            client/*.elf

  cia:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: whatsapp3ds
          path: out
      - name: Herramientas
        run: |
          curl -L https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip -o bannertool.zip
          unzip -o bannertool.zip -d bt
          curl -L https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.3/makerom-v0.18.3-ubuntu_x86_64.zip -o makerom.zip
          unzip -o makerom.zip -d mr
          chmod +x bt/linux-x86_64/bannertool mr/makerom
      - name: Recursos
        run: |
          python3 - <<'PY'
          import zlib, struct, wave
          def png(path, w, h, rgb):
              raw = b''.join(b'\x00' + bytes(rgb) * w for _ in range(h))
              def chunk(t, d):
                  c = struct.pack('>I', len(d)) + t + d
                  return c + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
              data = b'\x89PNG\r\n\x1a\n'
              data += chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
              data += chunk(b'IDAT', zlib.compress(raw))
              data += chunk(b'IEND', b'')
              open(path, 'wb').write(data)
          png('banner.png', 256, 128, (37, 211, 102))
          png('icon.png', 48, 48, (37, 211, 102))
          a = wave.open('audio.wav', 'wb')
          a.setnchannels(1)
          a.setsampwidth(2)
          a.setframerate(22050)
          a.writeframes(b'\x00\x00' * 22050)
          a.close()
          PY
      - name: Configuracion
